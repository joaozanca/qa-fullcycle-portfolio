groups:
  - name: qa-fullcycle-app
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[1m]))
          /
          sum(rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Taxa de erro acima de 5% na AUT"
          description: "Mais de 5% das requisições dos últimos 5 minutos retornaram status 5xx."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latência p95 acima de 500ms"
          description: "95% das requisições estão demorando mais de 500ms nos últimos 5 minutos."

      - alert: AppDown
        expr: up{job="qa-fullcycle-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "AUT não está respondendo"
          description: "O Prometheus não consegue coletar métricas da aplicação há 30s."
