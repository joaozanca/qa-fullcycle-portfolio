name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    name: Lint, typecheck e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Instalar dependências (raiz)
        run: npm ci --ignore-scripts
      - name: Instalar dependências (app)
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Gerar Prisma Client
        working-directory: app
        run: npm run prisma:generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        working-directory: app
        run: npm run typecheck
      - name: Testes unitários com coverage gate
        working-directory: app
        run: npm run test:unit:coverage
      - name: Build
        working-directory: app
        run: npm run build

  security-fast:
    name: Semgrep e Gitleaks
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source /repo --verbose
      - name: Semgrep
        run: docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan --config auto --error /src

  api-tests:
    name: Testes de API
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Subir a aplicação (docker compose)
        run: docker compose up -d --build
      - name: Aguardar app responder
        run: timeout 60 sh -c 'until curl -sf http://localhost:3000/health; do sleep 2; done'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Instalar dependências dos testes de API
        working-directory: tests/api
        run: npm ci --ignore-scripts
      - name: Rodar testes de API
        working-directory: tests/api
        run: npm test
      - name: Publicar resultados do Allure (API)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: allure-results-api
          path: reports/allure-results
      - name: Logs da aplicação (em caso de falha)
        if: failure()
        run: docker compose logs app

  e2e-tests:
    name: Testes E2E e acessibilidade
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Subir a aplicação (docker compose)
        run: docker compose up -d --build
      - name: Aguardar app responder
        run: timeout 60 sh -c 'until curl -sf http://localhost:3000/health; do sleep 2; done'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Instalar dependências dos testes E2E
        working-directory: tests/e2e
        run: npm ci --ignore-scripts
      - name: Instalar navegador do Playwright
        working-directory: tests/e2e
        run: npm run playwright:install
      - name: Rodar testes E2E
        working-directory: tests/e2e
        run: npm test
      - name: Publicar resultados do Allure (E2E)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: allure-results-e2e
          path: reports/allure-results
      - name: Logs da aplicação (em caso de falha)
        if: failure()
        run: docker compose logs app

  perf-test:
    name: Performance (k6)
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Subir a aplicação (docker compose)
        run: docker compose up -d --build
      - name: Aguardar app responder
        run: timeout 60 sh -c 'until curl -sf http://localhost:3000/health; do sleep 2; done'
      - name: Rodar k6
        run: docker run --rm --network qa_fullcycle_network -e BASE_URL=http://app:3000 -v "${{ github.workspace }}/tests/perf:/scripts" grafana/k6 run /scripts/load-test.js
      - name: Logs da aplicação (em caso de falha)
        if: failure()
        run: docker compose logs app

  dast-zap:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Subir a aplicação (docker compose)
        run: docker compose up -d --build
      - name: Aguardar app responder
        run: timeout 60 sh -c 'until curl -sf http://localhost:3000/health; do sleep 2; done'
      - name: Rodar OWASP ZAP baseline scan
        run: docker run --rm --network qa_fullcycle_network -v "${{ github.workspace }}/tests/security:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://app:3000 -r zap-report.html -I
      - name: Publicar relatório do ZAP
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: zap-report
          path: tests/security/zap-report.html

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Instalar dependências e gerar cobertura
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm run test:unit:coverage
      - name: SonarCloud Scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/usr/src" -w /usr/src sonarsource/sonar-scanner-cli \
            sonar-scanner \
            -D sonar.host.url=https://sonarcloud.io \
            -D sonar.organization=joaozanca \
            -D sonar.token=${{ secrets.SONAR_TOKEN }}

  allure-report:
    name: Relatório consolidado (Allure)
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests]
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Instalar dependências (raiz)
        run: npm ci --ignore-scripts
      - name: Baixar resultados (API)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: allure-results-api
          path: reports/allure-results
      - name: Baixar resultados (E2E)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: allure-results-e2e
          path: reports/allure-results
      - name: Gerar relatório Allure combinado
        run: npm run allure:generate
      - name: Publicar relatório Allure
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: allure-report
          path: reports/allure-report
