name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    name: Lint, typecheck e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Instalar dependências (raiz)
        run: npm ci
      - name: Instalar dependências (app)
        working-directory: app
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        working-directory: app
        run: npx tsc -p tsconfig.json --noEmit
      - name: Testes unitários com coverage gate
        working-directory: app
        run: npm run test:unit:coverage
      - name: Build
        working-directory: app
        run: npm run build

  security-fast:
    name: Semgrep e Gitleaks
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source /repo --verbose
      - name: Semgrep
        run: docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan --config auto --error /src

  api-tests:
    name: Testes de API
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Subir a aplicação (docker compose)
        run: docker compose up -d --build
      - name: Aguardar app responder
        run: timeout 60 sh -c 'until curl -sf http://localhost:3000/health; do sleep 2; done'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Instalar dependências dos testes de API
        working-directory: tests/api
        run: npm ci
      - name: Rodar testes de API
        working-directory: tests/api
        run: npx playwright test
      - name: Logs da aplicação (em caso de falha)
        if: failure()
        run: docker compose logs app

  e2e-tests:
    name: Testes E2E e acessibilidade
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Subir a aplicação (docker compose)
        run: docker compose up -d --build
      - name: Aguardar app responder
        run: timeout 60 sh -c 'until curl -sf http://localhost:3000/health; do sleep 2; done'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Instalar dependências dos testes E2E
        working-directory: tests/e2e
        run: npm ci
      - name: Instalar navegador do Playwright
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Rodar testes E2E
        working-directory: tests/e2e
        run: npx playwright test
      - name: Logs da aplicação (em caso de falha)
        if: failure()
        run: docker compose logs app
